packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  core-js: false
  unrs-resolver: true

# Targeted security fixes; query-string's CJS adapter is patched below.
overrides:
  'query-string@7.1.3>decode-uri-component': 0.5.0
  'xcode@3.0.1>uuid': 11.1.1

patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
