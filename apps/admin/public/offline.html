<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>אין חיבור — YellowShifts</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fa;
        color: #172033;
        font-family: Arial, sans-serif;
      }
      main {
        max-width: 360px;
        width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 22px;
        padding: 28px;
        background: white;
        text-align: center;
      }
      h1 {
        font-size: 25px;
      }
      p {
        font-size: 15px;
        line-height: 1.7;
        color: #647084;
      }
      button {
        width: 100%;
        min-height: 48px;
        background: #c9003c;
        color: white;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #647084;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>אין חיבור כרגע</h1>
      <p>ניהול התחנה דורש חיבור לאינטרנט. התחברו שוב כדי לראות נתונים עדכניים.</p>
      <button onclick="location.reload()">חיבור מחדש</button
      ><small>שינויים אינם נשמרים אוטומטית ברקע. בדקו שהתקבל אישור שמירה.</small>
    </main>
  </body>
</html>
